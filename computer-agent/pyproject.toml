[project]
name = "computer-agent"
version = "0.1.0"
description = "MCP Server 让 LLM 通过 PaddleOCR + pyautogui 操作电脑"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "paddleocr>=3.0.0",
    "paddlepaddle>=2.6.0",
    "mss>=9.0.1",
    "pyautogui>=0.9.54",
    "Pillow>=10.0.0",
    "pyperclip>=1.8.2",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
vision = [
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools]
packages = ["tools", "core"]
