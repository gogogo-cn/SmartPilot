<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pomodoro · Standalone</title>
<link rel="stylesheet" href="css/pomodoro.css">
<script src="js/i18n.js?v=v202610191933"></script>
<script src="js/ui-locale-switch.js?v=v202610191933"></script>
</head>
<body>
<div id="banner" class="banner"></div>
<div class="card">
  <div class="header">
    <div class="title"><span class="ico">🍅</span><span data-i18n="pomo.title">番茄钟</span></div>
    <div class="hdr-btns">
      <button class="hdr-btn wide" id="syncBtn" data-i18n-title="pomo.syncTip" title="同步状态 / 立即同步一次">
        <span class="dot" id="syncDot"></span><span class="sync-label" id="syncLabel" data-i18n="pomo.connecting">连接中…</span>
      </button>
      <button class="hdr-btn" id="gearBtn" data-i18n-title="pomo.gearTip" title="设置">⚙️</button>
    </div>
  </div>
  <div class="timer breakable" id="timer">25:00</div>
  <div class="status breakable" id="status" data-i18n="pomo.focus">专注中</div>
  <div class="session" id="session">第 0 / 4 个番茄</div>
  <div class="controls">
    <button class="btn breakable" id="startBtn" data-i18n="pomo.start">开始</button>
    <button class="btn secondary" id="pauseBtn" disabled data-i18n="pomo.pause">暂停</button>
    <button class="btn secondary" id="resetBtn" data-i18n="pomo.reset">重置</button>
  </div>
  <div class="progress-wrap"><div class="progress-fill breakable" id="progress"></div></div>
  <div class="stats">
    <div class="stat"><div class="stat-num" id="statTotal">0</div><div class="stat-label" data-i18n="pomo.statTotal">累计番茄</div></div>
    <div class="stat"><div class="stat-num" id="statMinutes">0</div><div class="stat-label" data-i18n="pomo.statMinutes">专注分钟</div></div>
    <div class="stat"><div class="stat-num" id="statToday">0</div><div class="stat-label" data-i18n="pomo.statToday">今日完成</div></div>
  </div>
</div>
<div class="footer" data-i18n="pomo.footer">独立模式 · 连接 Excel 时双向同步，离线自动保存本地</div>
<div class="overlay" id="overlay">
  <div class="panel">
    <h3>⚙️ <span data-i18n="pomo.settings">番茄钟设置</span></h3>
    <div class="field"><label data-i18n="pomo.workDur">专注时长（分钟）</label>
      <div class="field-row"><input type="range" id="workDur" min="1" max="60" step="1" value="25"><span class="val" id="workDurVal">25 分</span></div></div>
    <div class="field"><label data-i18n="pomo.shortDur">短休息时长（分钟）</label>
      <div class="field-row"><input type="range" id="shortDur" min="1" max="30" step="1" value="5"><span class="val" id="shortDurVal">5 分</span></div></div>
    <div class="field"><label data-i18n="pomo.longDur">长休息时长（分钟）</label>
      <div class="field-row"><input type="range" id="longDur" min="1" max="60" step="1" value="15"><span class="val" id="longDurVal">15 分</span></div></div>
    <div class="field"><label data-i18n="pomo.longEvery">长休息间隔（每 N 个番茄后）</label>
      <div class="field-row"><input type="range" id="longEvery" min="2" max="8" step="1" value="4"><span class="val" id="longEveryVal">4 个</span></div></div>
    <div class="field"><label><input type="checkbox" id="soundChk" checked> <span data-i18n="pomo.sound">完成时播放提示音</span></label></div>
    <div class="field"><label><input type="checkbox" id="notifChk" checked> <span data-i18n="pomo.notif">桌面通知（首次需授权）</span></label></div>
    <div class="panel-actions">
      <button class="btn secondary" id="cancelSettings" data-i18n="pomo.cancel">取消</button>
      <button class="btn" id="saveSettings" data-i18n="pomo.save">保存</button>
    </div>
  </div>
</div>
<script src="js/app-endpoints.js?v=v20261007001"></script>
<script src="js/pomodoro-app.js?v=v202610191933"></script>
</body>
</html>
